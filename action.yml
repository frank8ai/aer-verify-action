name: 'AER Verify'
description: 'Executable software-change acceptance for bug-fix PRs with Docker customer-code isolation and trusted contract binding.'
author: 'AER Team'

inputs:
  version:
    description: 'Exact AER Verify runtime version'
    required: false
    default: '0.1.0-beta.2'
  contract-path:
    description: 'Path to trusted acceptance contract relative to repository root (defaults to searching .aer/acceptance/*.yml)'
    required: false
    default: ''
  docker-image:
    description: 'Docker image for container sandbox execution'
    required: false
    default: 'python:3.12-slim'
  evidence-path:
    description: 'Output path for change-acceptance evidence JSON'
    required: false
    default: 'artifacts/aer/acceptance-evidence.json'
  brief-path:
    description: 'Output path for Markdown Acceptance Brief'
    required: false
    default: 'artifacts/aer/acceptance-brief.md'

outputs:
  verdict:
    description: 'Acceptance verdict (PASS, FAIL, UNKNOWN)'
    value: ${{ steps.run-aer.outputs.verdict }}
  reasons:
    description: 'Causal reasons for verdict'
    value: ${{ steps.run-aer.outputs.reasons }}

runs:
  using: 'composite'
  steps:
    - name: Obtain Entitlement and Download Compiled AER Runtime
      id: install-aer
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${{ inputs.version }}"
        BIN_DIR="${RUNNER_TEMP:-/tmp}/aer-bin"
        mkdir -p "$BIN_DIR"
        BINARY="$BIN_DIR/aer"

        echo "Obtaining authorized compiled AER Verify standalone runtime v${VERSION}..."

        # Official release asset endpoint
        ASSET_BASE="https://github.com/frank8ai/aer-runtime/releases/download/v${VERSION}"
        curl -fsSL --retry 3 "${ASSET_BASE}/aer" -o "$BINARY"
        curl -fsSL --retry 3 "${ASSET_BASE}/SHA256SUMS" -o "$BIN_DIR/SHA256SUMS"
        curl -fsSL --retry 3 "${ASSET_BASE}/aer.sigstore.json" -o "$BIN_DIR/aer.sigstore.json"

        # Strict SHA256 integrity verification
        echo "Verifying artifact SHA256 checksum..."
        (cd "$BIN_DIR" && sha256sum --check --strict SHA256SUMS)

        # Sigstore bundle structure validation (fails closed if tampered)
        python3 -c "
        import json, hashlib
        from pathlib import Path

        bundle = json.loads(Path('$BIN_DIR/aer.sigstore.json').read_text(encoding='utf-8'))
        digest = hashlib.sha256(Path('$BINARY').read_bytes()).hexdigest()
        assert bundle.get('mediaType') == 'application/vnd.dev.sigstore.bundle+json;version=0.2'
        signed = bundle['verificationMaterial']['signature']['signedDigest']
        assert signed == digest, f'Digest mismatch in Sigstore bundle: {signed} vs {digest}'
        print('Verified Sigstore bundle digest concordance.')
        "

        chmod +x "$BINARY"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "AER standalone binary installed and checksum verified."

    - name: Run Executable Change Acceptance
      id: run-aer
      shell: bash
      run: |
        mkdir -p "$(dirname "${{ inputs.evidence-path }}")"
        mkdir -p "$(dirname "${{ inputs.brief-path }}")"

        # Resolve exact base and head SHAs
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        if [ -z "$BASE_SHA" ]; then
          BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
        fi
        if [ -z "$HEAD_SHA" ]; then
          HEAD_SHA="$(git rev-parse HEAD 2>/dev/null || echo "")"
        fi

        echo "Resolving acceptance for base: $BASE_SHA vs candidate: $HEAD_SHA"

        CONTRACT_FLAG=""
        if [ -n "${{ inputs.contract-path }}" ]; then
          CONTRACT_FLAG="--contract-path ${{ inputs.contract-path }}"
        fi

        # Run AER in customer_code_mode with Docker sandbox driver
        set +e
        aer accept \
          --repo . \
          --base "$BASE_SHA" \
          --candidate "$HEAD_SHA" \
          $CONTRACT_FLAG \
          --sandbox-driver docker \
          --customer-code \
          --docker-image "${{ inputs.docker-image }}" \
          --output "${{ inputs.evidence-path }}" \
          --brief "${{ inputs.brief-path }}"
        EXIT_CODE=$?
        set -e

        # Extract verdict from evidence JSON if exists
        VERDICT="UNKNOWN"
        REASONS="[]"
        if [ -f "${{ inputs.evidence-path }}" ]; then
          VERDICT="$(python3 -c 'import json; d=json.load(open("${{ inputs.evidence-path }}")); print(d.get("verdict", "UNKNOWN"))')"
          REASONS="$(python3 -c 'import json; d=json.load(open("${{ inputs.evidence-path }}")); print(json.dumps(d.get("reasons", [])))')"
        fi

        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        echo "reasons=$REASONS" >> "$GITHUB_OUTPUT"

        # Publish brief to GitHub Step Summary
        if [ -f "${{ inputs.brief-path }}" ]; then
          cat "${{ inputs.brief-path }}" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "AER Verdict: $VERDICT (exit: $EXIT_CODE)"

        # Verdict Mapping:
        # PASS -> 0 (success)
        # FAIL -> 1 (fail check)
        # UNKNOWN -> 2 (non-success / human action required)
        if [ "$VERDICT" = "PASS" ]; then
          exit 0
        elif [ "$VERDICT" = "FAIL" ]; then
          echo "::error::AER Verify rejected candidate change (verdict: FAIL)."
          exit 1
        else
          echo "::error::AER Verify evidence inconclusive or untrusted (verdict: UNKNOWN)."
          exit 2
        fi
