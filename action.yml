name: 'AER Verify'
description: 'Executable software-change acceptance for bug-fix PRs with Docker customer-code isolation and trusted contract binding.'
author: 'AER Team'

inputs:
  version:
    description: 'Exact AER Verify runtime version release tag with published assets'
    required: false
    default: 'v0.2.2-rc.1'
  contract-path:
    description: 'Path to trusted acceptance contract relative to repository root (defaults to searching .aer/acceptance/*.yml)'
    required: false
    default: ''
  docker-image:
    description: 'Docker image for container sandbox execution'
    required: false
    default: 'python:3.12-slim'
  evidence-path:
    description: 'Output path for change-acceptance evidence JSON'
    required: false
    default: 'artifacts/aer/acceptance-evidence.json'
  brief-path:
    description: 'Output path for Markdown Acceptance Brief'
    required: false
    default: 'artifacts/aer/acceptance-brief.md'

outputs:
  verdict:
    description: 'Acceptance verdict (PASS, FAIL, UNKNOWN)'
    value: ${{ steps.run-aer.outputs.verdict }}
  reasons:
    description: 'Causal reasons for verdict'
    value: ${{ steps.run-aer.outputs.reasons }}

runs:
  using: 'composite'
  steps:
    - name: Download the compiled AER runtime
      id: install-aer
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${{ inputs.version }}"
        TAG="${VERSION}"
        if [[ ! "${TAG}" =~ ^v ]]; then
          TAG="v${TAG}"
        fi

        if [ -z "$VERSION" ]; then
          echo "::error::aer-verify-action requires an explicit 'version' input (a release tag with assets)."
          exit 2
        fi

        BIN_DIR="${RUNNER_TEMP:-/tmp}/aer-bin"
        mkdir -p "$BIN_DIR"
        BINARY="$BIN_DIR/aer"

        echo "Downloading AER Verify standalone runtime ${TAG}..."

        REPO="frank8ai/aer-verify-action"
        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}"

        if command -v gh >/dev/null 2>&1; then
          gh release download "${TAG}" --repo "${REPO}" --pattern "aer" --output "$BINARY" 2>/dev/null ||           curl -fsSL --retry 3 "${DOWNLOAD_URL}/aer" -o "$BINARY"
          gh release download "${TAG}" --repo "${REPO}" --pattern "SHA256SUMS" --output "$BIN_DIR/SHA256SUMS" 2>/dev/null ||           curl -fsSL --retry 3 "${DOWNLOAD_URL}/SHA256SUMS" -o "$BIN_DIR/SHA256SUMS"
        else
          curl -fsSL --retry 3 "${DOWNLOAD_URL}/aer" -o "$BINARY"
          curl -fsSL --retry 3 "${DOWNLOAD_URL}/SHA256SUMS" -o "$BIN_DIR/SHA256SUMS"
        fi

        echo "Verifying artifact SHA256 checksum..."
        EXPECTED_SHA=$(awk '$2 == "aer" || $2 == "*aer" || $2 ~ "(^|/)aer$" {print $1; exit}' "$BIN_DIR/SHA256SUMS" 2>/dev/null || true)
        if [ -z "$EXPECTED_SHA" ]; then
          EXPECTED_SHA=$(grep -oE '[0-9a-fA-F]{64}' "$BIN_DIR/SHA256SUMS" | head -n 1 2>/dev/null || true)
        fi
        CLEAN_SHA=$(echo "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        if [[ ! "$CLEAN_SHA" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::Could not parse valid 64-hex aer digest from SHA256SUMS"
          exit 1
        fi
        echo "${CLEAN_SHA}  ${BINARY}" | sha256sum -c --strict
        echo "Verified release checksum successfully." 

        chmod +x "$BINARY"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "AER standalone binary installed and checksum verified."

    - name: Run Executable Change Acceptance
      id: run-aer
      shell: bash
      run: |
        set -uo pipefail

        EVIDENCE="${{ inputs.evidence-path }}"
        BRIEF="${{ inputs.brief-path }}"
        mkdir -p "$(dirname "$EVIDENCE")" "$(dirname "$BRIEF")"

        # Resolve exact base and head SHAs
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        if [ -z "$BASE_SHA" ]; then
          BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
        fi
        if [ -z "$HEAD_SHA" ]; then
          HEAD_SHA="$(git rev-parse HEAD 2>/dev/null || echo "")"
        fi

        echo "Resolving acceptance for base: $BASE_SHA vs candidate: $HEAD_SHA"

        # SECURITY: the evidence path is inside the candidate checkout and is
        # not gitignored, so a pull request can commit a forged
        # {"verdict": "PASS"} there. Delete any pre-existing artefact before the
        # run so only evidence produced by THIS execution can be read.
        rm -f "$EVIDENCE" "$BRIEF"

        CONTRACT_FLAG=""
        if [ -n "${{ inputs.contract-path }}" ]; then
          CONTRACT_FLAG="--contract-path ${{ inputs.contract-path }}"
        fi

        # Check for Initial Repository Onboarding (contract absent on base but introduced on candidate)
        CONTRACT_FILE="${{ inputs.contract-path }}"
        if [ -z "$CONTRACT_FILE" ]; then
          CONTRACT_FILE=".aer/acceptance/default.yml"
        fi

        IS_ONBOARDING=0
        if [ -n "$BASE_SHA" ] && ! git cat-file -e "${BASE_SHA}:${CONTRACT_FILE}" 2>/dev/null; then
          if git cat-file -e "${HEAD_SHA}:${CONTRACT_FILE}" 2>/dev/null; then
            IS_ONBOARDING=1
            echo "Detected initial AER onboarding PR: ${CONTRACT_FILE} is being introduced into repository."
          fi
        fi

        if [ "$IS_ONBOARDING" -eq 1 ]; then
          python3 -c "import json, datetime, sys; ev = {'schemaVersion': 'change-acceptance/v1', 'verdict': 'PASS', 'reasons': ['AER_ONBOARDING_INITIAL_CONTRACT_DEPLOYMENT: base commit does not yet contain trusted contract; initial onboarding verified.'], 'timestamp': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'repository': sys.argv[4] if len(sys.argv) > 4 and sys.argv[4] else 'unknown', 'baseline': {'sha': sys.argv[2]}, 'candidate': {'sha': sys.argv[3]}}; open(sys.argv[1], 'w', encoding='utf-8').write(json.dumps(ev, indent=2))" "$EVIDENCE" "$BASE_SHA" "$HEAD_SHA" "${GITHUB_REPOSITORY:-unknown}"
          {
            echo "# AER Verify Acceptance Brief"
            echo "**Verdict**: PASS (Initial Repository Onboarding)"
            echo "**Reasons**: Base commit does not yet contain trusted contract; initial onboarding contract introduced cleanly on candidate."
          } > "$BRIEF"
          EXIT_CODE=0
        else
          # Run AER in customer_code_mode with Docker sandbox driver
          set +e
          aer accept \
            --repo . \
            --base "$BASE_SHA" \
            --candidate "$HEAD_SHA" \
            $CONTRACT_FLAG \
            --sandbox-driver docker \
            --customer-code \
            --docker-image "${{ inputs.docker-image }}" \
            --output "$EVIDENCE" \
            --brief "$BRIEF"
          EXIT_CODE=$?
          set -e
        fi

        # Publish the brief even when the run failed, so a human can see why.
        if [ -f "$BRIEF" ]; then
          cat "$BRIEF" >> "$GITHUB_STEP_SUMMARY"
        fi

        # The exit code of `aer accept` is authoritative, and the evidence
        # document must bind to the exact (base, candidate) pair under review.
        # Both conditions live in a unit-tested helper rather than inline shell.
        set +e
        python3 "${{ github.action_path }}/validate_evidence.py" \
          --evidence "$EVIDENCE" \
          --exit-code "$EXIT_CODE" \
          --base-sha "$BASE_SHA" \
          --head-sha "$HEAD_SHA" \
          --github-output "$GITHUB_OUTPUT"
        ADMISSIBILITY_EXIT=$?
        set -e

        # Verdict Mapping (decided by validate_evidence.py):
        # PASS -> 0 (success)
        # FAIL -> 1 (fail check)
        # UNKNOWN -> 2 (non-success / human action required)
        if [ "$ADMISSIBILITY_EXIT" -eq 1 ]; then
          echo "::error::AER Verify rejected candidate change (verdict: FAIL)."
        elif [ "$ADMISSIBILITY_EXIT" -eq 2 ]; then
          echo "::error::AER Verify evidence inconclusive or untrusted (verdict: UNKNOWN)."
        fi
        exit "$ADMISSIBILITY_EXIT"
